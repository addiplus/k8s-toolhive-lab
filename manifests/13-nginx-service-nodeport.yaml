# Service (NodePort) = ClusterIP + a static port opened on EVERY node's IP.
# Docker analogy: -p 30080:80, except it's opened on all nodes of the cluster,
# not one host. On a kind cluster the "node" is a Docker container, so the
# NodePort lands on the container's network namespace - which is exactly why
# local workflows usually use `kubectl port-forward` instead (it tunnels
# through the API server and needs no reachable node IP).
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: lab
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
