# Secret = like a ConfigMap but for sensitive values (base64-encoded at rest
# in etcd, mountable as files or env vars, RBAC-scoped separately).
# This one is a DEMO value only - it exists to show the mechanics.
apiVersion: v1
kind: Secret
metadata:
  name: demo-credentials
  namespace: lab
type: Opaque
stringData:
  DEMO_API_KEY: "not-a-real-key-just-plumbing"
---
# Same value, second namespace - ON PURPOSE. A pod's secretKeyRef can only
# name a Secret in its OWN namespace; there is no cross-namespace reference.
# Namespaces isolate objects hard: the client pod in lab-b cannot see or
# mount lab's Secret at all. If lab-b needs it, someone with RBAC on both
# namespaces has to copy it. That asymmetry (objects: hard boundary,
# network: open by default) is the core namespace-isolation lesson.
apiVersion: v1
kind: Secret
metadata:
  name: demo-credentials-copy
  namespace: lab-b
type: Opaque
stringData:
  DEMO_API_KEY: "not-a-real-key-just-plumbing"
