# Deployment = desired state for a set of identical pods.
# Docker analogy: `docker run -d --restart=always` describes ONE container;
# a Deployment describes N replicas + rollout strategy, and the control plane
# (via a generated ReplicaSet) keeps reality converged to it. Delete a pod and
# the ReplicaSet replaces it - that's the loop Docker never gave you.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lab
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          # requests = scheduler's admission math; limits = cgroup ceiling.
          # Docker analogy: --memory/--cpus, but requests also drive WHERE the
          # pod can be placed, not just how much it may burn once running.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: index
          configMap:
            name: nginx-index
